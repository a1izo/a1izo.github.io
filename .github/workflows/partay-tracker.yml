name: Partay burndown snapshot

on:
  schedule:
    - cron: '50 22 * * *'   # 23:50 in Copenhagen (winter time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save today's burndown point
        run: node .github/partay/snapshot.mjs
